name: Hostinger readiness

on:
  push:
    branches: [main, hostinger-node-runtime]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check server.js
      - run: npm run build
      - run: npm run lint
