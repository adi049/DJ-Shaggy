name: Hostinger readiness

on:
  push:
    branches: [main, hostinger-node-runtime]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check server.js
      - run: npm run build
      - name: Smoke-test Node runtime
        run: |
          PORT=8787 npm start > /tmp/dj-shaggy-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8787/healthz > /tmp/health.json; then break; fi
            sleep 1
          done
          grep -q '"ok":true' /tmp/health.json
          test "$(curl -s -o /tmp/api.json -w '%{http_code}' http://127.0.0.1:8787/api/settings)" = "503"
          grep -q 'SUPABASE_URL' /tmp/api.json
